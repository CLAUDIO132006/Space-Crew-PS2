name: Compilar Space Crew PS2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ps2dev/ps2dev:latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar gsKit
        run: |
          rm -rf "$PS2DEV/gsKit"
          git clone https://github.com/ps2dev/gsKit.git "$PS2DEV/gsKit"
          cd "$PS2DEV/gsKit"
          make
          make install

      - name: Compilar juego
        run: make

      - name: Guardar ELF
        uses: actions/upload-artifact@v4
        with:
          name: Space-Crew-PS2
          path: "*.elf"
          if-no-files-found: error
