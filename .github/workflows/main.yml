name: Compilar Space Crew PS2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ps2dev/ps2dev:latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Make
        run: apk add --no-cache make

      - name: Comprobar herramientas
        run: |
          make --version
          mips64r5900el-ps2-elf-gcc --version

      - name: Compilar juego
        run: make

      - name: Guardar archivo ELF
        uses: actions/upload-artifact@v4
        with:
          name: Space-Crew-PS2-v0.1
          path: "*.elf"
          if-no-files-found: error
