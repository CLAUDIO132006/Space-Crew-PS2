steps:
  - name: Descargar codigo
    uses: actions/checkout@v4

  - name: Instalar Make
    run: apk add --no-cache make

  - name: Compilar juego
    run: make

  - name: Guardar archivo ELF
    uses: actions/upload-artifact@v4
    with:
      name: Space-Crew-PS2
      path: "*.elf"
      if-no-files-found: error
